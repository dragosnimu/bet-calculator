services:
  bet-calculator:
    build: .
    container_name: bet-calculator
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ALERT_STATE_FILE=/data/alert-state.json
      - ALERT_TZ=${ALERT_TZ:-Europe/Bucharest}
      - MARKET_OPEN_HOUR=${MARKET_OPEN_HOUR:-10}
      - MARKET_CLOSE_HOUR=${MARKET_CLOSE_HOUR:-18}
    volumes:
      - alert-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Worker de alerte: verifica preturile la 15 min (cat e bursa deschisa) si trimite pe Telegram.
  bet-alert-worker:
    build: .
    container_name: bet-alert-worker
    restart: unless-stopped
    command: ["node", "scripts/price-alert-worker.mjs"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ALERT_STATE_FILE=/data/alert-state.json
      - ALERT_INTERVAL_MIN=${ALERT_INTERVAL_MIN:-15}
      - ALERT_DROP_STEP=${ALERT_DROP_STEP:-1}
      - ALERT_TZ=${ALERT_TZ:-Europe/Bucharest}
      - MARKET_OPEN_HOUR=${MARKET_OPEN_HOUR:-10}
      - MARKET_CLOSE_HOUR=${MARKET_CLOSE_HOUR:-18}
    volumes:
      - alert-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alert-data:
