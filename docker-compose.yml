services:
  bet-calculator:
    build:
      context: .
      dockerfile: dockerfile
    container_name: bet-calculator
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Worker de alerte: verifica preturile la 15 min (cat e bursa deschisa) si trimite pe Telegram.
  bet-alert-worker:
    build:
      context: .
      dockerfile: dockerfile
    container_name: bet-alert-worker
    restart: unless-stopped
    command: ["node", "scripts/price-alert-worker.mjs"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ALERT_STATE_FILE=/data/alert-state.json
      - ALERT_INTERVAL_MIN=${ALERT_INTERVAL_MIN:-15}
      - ALERT_DROP_STEP=${ALERT_DROP_STEP:-3}
      - ALERT_RISE_STEP=${ALERT_RISE_STEP:-1}
      - ALERT_TZ=${ALERT_TZ:-Europe/Bucharest}
      - MARKET_OPEN_HOUR=${MARKET_OPEN_HOUR:-10}
      - MARKET_CLOSE_HOUR=${MARKET_CLOSE_HOUR:-18}
      - TREND_ENABLED=${TREND_ENABLED:-true}
      - TREND_WINDOW=${TREND_WINDOW:-8}
      - TREND_MIN_MOVE=${TREND_MIN_MOVE:-1.0}
      - TREND_MIN_R2=${TREND_MIN_R2:-0.6}
      - SIGNAL_ENABLED=${SIGNAL_ENABLED:-true}
      - SIGNAL_STRONG_BUY=${SIGNAL_STRONG_BUY:-55}
      - SIGNAL_STRONG_SELL=${SIGNAL_STRONG_SELL:--55}
      - SIGNAL_MIN_CONFIRMS=${SIGNAL_MIN_CONFIRMS:-3}
      - SIGNAL_COOLDOWN_MIN=${SIGNAL_COOLDOWN_MIN:-45}
      - VERDICT_MIN_BARS=${VERDICT_MIN_BARS:-30}
      - ANNOUNCE_ENABLED=${ANNOUNCE_ENABLED:-true}
      - SENTIMENT_ENABLED=${SENTIMENT_ENABLED:-true}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SENTIMENT_MODEL=${SENTIMENT_MODEL:-claude-opus-5}
      - SENTIMENT_MIN_ABS=${SENTIMENT_MIN_ABS:-0.5}
      - NEWS_LOOKBACK_DAYS=${NEWS_LOOKBACK_DAYS:-3}
      - NEWS_EVERY_TICKS=${NEWS_EVERY_TICKS:-4}
    volumes:
      - alert-data:/data
    # Worker-ul nu e server web -> dezactivam healthcheck-ul HTTP mostenit din Dockerfile.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alert-data:
